version: 2

project_name: mdfs
dist: dist

builds:
  - id: mdfs
    dir: backend
    main: ./cmd/mdfs
    binary: mdfs
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: linux
    ids:
      - mdfs
    formats:
      - tar.gz
    name_template: "mdfs_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    files:
      - src: configs/mdfs.toml
        dst: config/mdfs.toml
      - src: deploy/systemd/mdfs.service
        dst: systemd/mdfs.service
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "0.0.0-snapshot"

changelog:
  disable: true
