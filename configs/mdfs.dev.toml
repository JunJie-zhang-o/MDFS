[server]
listen = "127.0.0.1:8080"
public_url = ""
session_timeout = "60m"

[[shares]]
name = "shared"
path = "../shared"

[anonymous]
permissions = "RWD"

[[users]]
name = "admin"
password = "admin"
permissions = "RWD"

[webdav]
enabled = true
prefix = "/webdav"

[ui]
title = "MDFS"
notice = "开发环境：匿名用户拥有读写删除权限"
default_language = "zh-CN"

[features]
max_upload_bytes = 1000000000000
max_search_results = 1000
image_preview = true

[logging]
directory = ""
