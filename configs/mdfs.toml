[server]
listen = "0.0.0.0:8080"
public_url = ""
session_timeout = "60m"

[server.tls]
cert_file = ""
key_file = ""

[[shares]]
name = "shared"
path = "/srv/mdfs"

[anonymous]
permissions = "R"

[access]
allow = []
deny = []
trusted_proxies = []

[webdav]
enabled = true
prefix = "/webdav"

[ui]
title = "MDFS"
notice = ""
default_language = "zh-CN"

[features]
max_upload_bytes = 1000000000000
max_search_results = 1000
leaf_directory_download_only = false
image_preview = true
readme_files = ["README.md", "readme.md", "index.md"]

[logging]
directory = ""
